<!doctype html><html lang="en"><meta charset="utf-8"><title>Megabees Renew preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:896px;height:504px;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:url('Preview.png') center/cover}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--veil) 0%,rgba(38,42,29,.94) 27%,rgba(38,42,29,.15) 60%,transparent 100%)}
.copy{position:absolute;left:50px;top:54px;width:410px;color:var(--inkPrimary);text-shadow:0 3px 10px #000b}
h1{font-size:46px;font-weight:600;line-height:1.1;margin:0;letter-spacing:0}
h1 span{font-size:.65em;color:var(--inkSecondary)}
.tag{font-size:24px;line-height:1.1;letter-spacing:.2px;color:var(--inkSecondary);margin-top:8px}
.rule{width:58px;height:3px;background:var(--accent);margin-top:20px;margin-bottom:16px}
p{font-size:21px;line-height:1.45;margin:0;width:370px}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;line-height:1;font-weight:700;color:var(--badgeInk)}
</style><div class="veil"></div><div class="copy"><h1>Megabees<br><span>Renew</span></h1><div class="tag">(unofficial)</div><div class="rule"></div><p>Giant bees.<br>Wool, eggs and tallow.</p></div><div class="badge"></div><div class="version">1.6</div>
<script>
fetch('preview-palette.json').then(r=>r.json()).then(p=>{for(const [k,v] of Object.entries(p))document.documentElement.style.setProperty('--'+k,v);return document.fonts.ready}).then(()=>document.body.dataset.ready='true');
</script></html>
